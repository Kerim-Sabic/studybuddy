name: studybuddy
description: The most comprehensive, research-backed study helper application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  firebase_remote_config: ^4.3.8

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0

  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2

  # Real-time & WebSockets
  web_socket_channel: ^2.4.0
  stream_chat_flutter: ^7.3.0

  # Calendar & Time
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^24.1.41
  intl: ^0.19.0
  timezone: ^0.9.2

  # Notifications
  flutter_local_notifications: ^16.3.0

  # AI & ML
  flutter_gemini: ^2.0.3
  google_generative_ai: ^0.2.2

  # Charts & Visualizations
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

  # PDF & Documents
  pdf: ^3.10.7
  printing: ^5.11.1
  syncfusion_flutter_pdf: ^24.1.41

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  image_cropper: ^5.0.1

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  record: ^5.0.4

  # Utils
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_dotenv: ^5.1.0
  logger: ^2.0.2+1
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1

  # Accessibility
  flutter_tts: ^3.8.5
  speech_to_text: ^6.5.1

  # Payments
  flutter_stripe: ^10.1.1

  # Permissions
  permission_handler: ^11.1.0

  # Canvas & Drawing
  flutter_colorpicker: ^1.0.3
  perfect_freehand: ^2.0.3

  # Markdown
  flutter_markdown: ^0.6.18+2
  markdown: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  drift_dev: ^2.14.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  faker: ^2.1.0
  firebase_core_platform_interface: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/trees/
    - assets/images/badges/
    - assets/images/backgrounds/
    - assets/sounds/
    - assets/sounds/focus/
    - assets/sounds/notifications/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
